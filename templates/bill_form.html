{% extends "base.html" %}
{% block title %}Edit bill · UrbanNest{% endblock %}
{% block content %}
  <h1 class="page-title h2 mb-4">Edit bill</h1>
  <div class="panel p-4" style="max-width:36rem;">
    <form method="post" class="row g-3">
      <div class="col-12">
        <label class="form-label">Resident</label>
        <select class="form-select" name="resident_id">
          {% for r in residents %}<option value="{{ r.resident_id }}" {% if r.resident_id == row.resident_id %}selected{% endif %}>{{ r.full_name }} ({{ r.flat_number }})</option>{% endfor %}
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Month</label>
        <select class="form-select" name="bill_month">{% for m in months %}<option value="{{ m }}" {% if m == row.bill_month %}selected{% endif %}>{{ m }}</option>{% endfor %}</select>
      </div>
      <div class="col-6"><label class="form-label">Year</label><input class="form-control" type="number" name="bill_year" value="{{ row.bill_year }}" required></div>
      <div class="col-6"><label class="form-label">Amount</label><input class="form-control" type="number" step="0.01" name="amount" value="{{ row.amount }}" required></div>
      <div class="col-6">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">{% for t in statuses %}<option {% if t == row.status %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
      </div>
      <div class="col-6"><label class="form-label">Due date</label><input class="form-control" type="date" name="due_date" value="{{ row.due_date|input_date }}" required></div>
      <div class="col-6"><label class="form-label">Generated on</label><input class="form-control" type="date" name="generated_on" value="{{ row.generated_on|input_date }}" required></div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-accent" type="submit">Update</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('bills') }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
