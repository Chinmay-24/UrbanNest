{% extends "base.html" %}
{% block title %}Edit booking · UrbanNest{% endblock %}
{% block content %}
  <h1 class="page-title h2 mb-4">Edit booking</h1>
  <div class="panel p-4" style="max-width:36rem;">
    <form method="post" class="row g-3">
      <div class="col-12">
        <label class="form-label">Facility</label>
        <select class="form-select" name="facility_id">
          {% for f in facilities %}<option value="{{ f.facility_id }}" {% if f.facility_id == row.facility_id %}selected{% endif %}>{{ f.facility_name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Resident</label>
        <select class="form-select" name="resident_id">
          {% for r in residents %}<option value="{{ r.resident_id }}" {% if r.resident_id == row.resident_id %}selected{% endif %}>{{ r.full_name }} ({{ r.flat_number }})</option>{% endfor %}
        </select>
      </div>
      <div class="col-12"><label class="form-label">Date</label><input class="form-control" type="date" name="booking_date" value="{{ row.booking_date|input_date }}" required></div>
      <div class="col-6"><label class="form-label">Start</label><input class="form-control" type="time" name="start_time" value="{{ row.start_time|input_time }}" required></div>
      <div class="col-6"><label class="form-label">End</label><input class="form-control" type="time" name="end_time" value="{{ row.end_time|input_time }}" required></div>
      <div class="col-6">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">{% for t in statuses %}<option {% if t == row.status %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
      </div>
      <div class="col-6"><label class="form-label">Charge</label><input class="form-control" type="number" step="0.01" name="total_charge" value="{{ row.total_charge }}" required></div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-accent" type="submit">Update</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('bookings') }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
