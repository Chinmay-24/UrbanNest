{% extends "base.html" %}
{% block title %}Edit facility · UrbanNest{% endblock %}
{% block content %}
  <h1 class="page-title h2 mb-4">Edit facility</h1>
  <div class="panel p-4" style="max-width:36rem;">
    <form method="post" class="row g-3">
      <div class="col-12"><label class="form-label">Name</label><input class="form-control" name="facility_name" value="{{ row.facility_name }}" required></div>
      <div class="col-12"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ row.location }}" required></div>
      <div class="col-6"><label class="form-label">Capacity</label><input class="form-control" type="number" name="capacity" value="{{ row.capacity }}" required></div>
      <div class="col-6"><label class="form-label">Hourly rate</label><input class="form-control" type="number" step="0.01" name="hourly_rate" value="{{ row.hourly_rate }}" required></div>
      <div class="col-12 form-check">
        <input class="form-check-input" type="checkbox" name="is_active" id="active" {% if row.is_active %}checked{% endif %}>
        <label class="form-check-label" for="active">Active</label>
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-accent" type="submit">Update</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('facilities') }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
