{% extends "base.html" %}
{% block title %}Edit payment · UrbanNest{% endblock %}
{% block content %}
  <h1 class="page-title h2 mb-4">Edit payment</h1>
  <div class="panel p-4" style="max-width:36rem;">
    <form method="post" class="row g-3">
      <div class="col-12">
        <label class="form-label">Bill</label>
        <select class="form-select" name="bill_id">
          {% for b in bills %}<option value="{{ b.bill_id }}" {% if b.bill_id == row.bill_id %}selected{% endif %}>#{{ b.bill_id }} {{ b.full_name }} {{ b.bill_month }}/{{ b.bill_year }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Received by</label>
        <select class="form-select" name="received_by_staff_id">
          {% for s in staff %}<option value="{{ s.staff_id }}" {% if s.staff_id == row.received_by_staff_id %}selected{% endif %}>{{ s.full_name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-6"><label class="form-label">Amount</label><input class="form-control" type="number" step="0.01" name="amount_paid" value="{{ row.amount_paid }}" required></div>
      <div class="col-6"><label class="form-label">Date</label><input class="form-control" type="date" name="payment_date" value="{{ row.payment_date|input_date }}" required></div>
      <div class="col-6">
        <label class="form-label">Mode</label>
        <select class="form-select" name="payment_mode">{% for t in modes %}<option {% if t == row.payment_mode %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
      </div>
      <div class="col-6"><label class="form-label">Txn ref</label><input class="form-control" name="transaction_ref" value="{{ row.transaction_ref }}" required></div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-accent" type="submit">Update</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('payments') }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
